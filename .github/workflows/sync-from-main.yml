# Keeps the Hindi site in step with the main site.
# It pulls new commits from kansal15/gauravkansal.in into this repo,
# keeps this repo's own CNAME, and asks GitHub Pages to rebuild.

name: Sync from main site

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at minute 17 (UTC)
  workflow_dispatch:        # "Run workflow" button for a manual sync

permissions:
  contents: write           # to push the merge
  pages: write              # to ask Pages to rebuild

concurrency:
  group: sync-from-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch the main site
        run: |
          git remote add upstream https://github.com/kansal15/gauravkansal.in.git
          git fetch upstream master

      - name: Merge new changes, if any
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Nothing new on the main site."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep this repo's CNAME (वेब.कंसल.भारत), whatever the main site has.
          git merge --no-ff --no-commit upstream/master || true
          git checkout HEAD -- CNAME
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Merge conflict. Please sync this repo by hand."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m "Sync from main site (kansal15/gauravkansal.in)"
          git push origin master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
